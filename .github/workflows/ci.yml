name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # A build-time placeholder — Prisma needs a syntactically valid
      # connection string to generate its client, but no real database
      # connection happens during typecheck/lint/test/build.
      DATABASE_URL: "postgresql://user:password@localhost:5432/diose_ci"
      AUTH_SECRET: "ci-placeholder-secret"
      NEXT_PUBLIC_SITE_URL: "https://diose.com.mx"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
